<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kieed — Hatsune Miku Cover</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;0,6..96,800;1,6..96,600&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Wee';
      src: url('SoukouMincho.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: 'Lao';
      src: url('Makcasa-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --ink: #0d0e1e;
      --paper: #f3f0e8;
      --line: rgba(243, 240, 232, 0.18);
      --font-display: 'Bodoni Moda', serif;
      --font-mono: 'Space Mono', monospace;

      /* Second palette, pulled from the underwater artwork's cool blues and
         the Sekai cover reference's indigo/gold — used only on the
         .cover--sekai variant below, so the two covers read as distinct. */
      --deep: #121936;
      --deep-soft: rgba(18, 25, 54, 0.78);
      --frost: #dde8ef;
      --gold: #c9a463;
      --coral: #e2572c;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      margin: 0;
      padding: 0;
      font-family: var(--font-mono);
      overflow-x: hidden;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    body::-webkit-scrollbar {
      display: none;
    }

    img {
      display: block;
    }

    /* ============ Signature intro ============ */

    .intro {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      transition: opacity 0.6s ease;
    }

    .intro.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .intro__sig {
      width: min(58vw, 420px);
      height: auto;
      overflow: visible;
      filter: drop-shadow(0 2px 20px rgba(0, 0, 0, 0.55));
    }

    .intro__sig path {
      fill: none;
      stroke: var(--paper);
      stroke-width: 34;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: var(--len);
      stroke-dashoffset: var(--len);
      animation-name: sigDraw;
      animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1);
      animation-fill-mode: forwards;
      /* Stay paused until JS has measured the real length of each path
         (see script below) — the --len values above are only a fallback,
         and starting before they're corrected caused the "no animation"
         look, since the guessed lengths were shorter than the real path. */
      animation-play-state: paused;
    }

    .intro__sig.is-ready path {
      animation-play-state: running;
    }

    @keyframes sigDraw {
      to {
        stroke-dashoffset: 0;
      }
    }

    .intro__skip {
      position: absolute;
      bottom: 7%;
      left: 50%;
      transform: translateX(-50%);
      color: var(--paper);
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      opacity: 0;
      cursor: pointer;
      transition: opacity 0.5s ease;
    }

    .intro__skip.is-visible {
      opacity: 0.5;
    }

    .intro__skip.is-prompt {
      font-size: 11px;
      letter-spacing: 0.24em;
      animation: introPromptPulse 1.6s ease-in-out infinite;
    }

    @keyframes introPromptPulse {

      0%,
      100% {
        opacity: 0.5;
      }

      50% {
        opacity: 1;
      }
    }

    .intro__skip:hover {
      opacity: 0.9;
    }

    /* ============ Carousel ("roulette") shell ============ */

    .carousel {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background: #000;
      overflow-x: hidden;
      overflow-y: visible;
    }

    .carousel__track {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* Each cover lives in its own slide. Add more .cover-slide blocks
       inside #carouselTrack to grow the rotation — the barcode, dot
       navigation, autoplay and text entrance animation all pick up
       new slides automatically. Only the first slide should carry
       the "is-active" class. */
    .cover-slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.9s ease, visibility 0s linear 0.9s;
      z-index: 1;
    }

    .cover-slide.is-active {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.9s ease, visibility 0s linear 0s;
      z-index: 2;
    }

    .carousel__arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      z-index: 20;
      background: none;
      border: none;
      color: var(--paper);
      font-family: var(--font-display);
      font-size: clamp(22px, 3vw, 46px);
      line-height: 1;
      padding: 14px 10px;
      opacity: 0.4;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }

    .carousel__arrow:hover {
      opacity: 0.9;
    }

    .carousel__arrow--prev {
      left: 1.5%;
    }

    .carousel__arrow--next {
      right: 1.5%;
    }

    .carousel__dots {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 34px;
      z-index: 20;
      display: flex;
      justify-content: center;
      gap: 9px;
    }

    .carousel__dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      border: none;
      background: var(--paper);
      opacity: 0.35;
      padding: 0;
      cursor: pointer;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .carousel__dot.is-active {
      opacity: 1;
      transform: scale(1.25);
    }

    .carousel__arrow:focus-visible,
    .carousel__dot:focus-visible {
      outline: 1px solid var(--paper);
      outline-offset: 3px;
    }

    /* ============ Roll ("slot machine") reveal ============ */
    /* Runs once, right after the signature intro fades out: the cover art
       cycles rapidly through the slides, slowing down, then lands on a
       randomly chosen one. Everything in this block is placeholder FX —
       swap the filter/keyframes for your own look whenever you're ready. */

    .carousel.is-rolling .cover-slide {
      transition: none !important;
    }

    .carousel.is-rolling .cover__bg,
    .carousel.is-rolling .cover__art {
      filter: blur(5px) saturate(1.4) brightness(1.12);
    }

    .carousel.is-rolling .cover__scrim {
      opacity: 0.35;
    }

    .carousel.is-rolling .animate-text {
      opacity: 0 !important;
    }

    /* PLACEHOLDER FX — spin streaks. Purely decorative overlay while rolling. */
    .reel-streaks {
      position: absolute;
      inset: 0;
      z-index: 6;
      opacity: 0;
      pointer-events: none;
      background: repeating-linear-gradient(180deg,
          rgba(243, 240, 232, 0) 0px,
          rgba(243, 240, 232, 0.10) 2px,
          rgba(243, 240, 232, 0) 5px);
      mix-blend-mode: overlay;
    }

    .carousel.is-rolling .reel-streaks {
      opacity: 1;
      animation: reelStreaks 0.35s linear infinite;
    }

    @keyframes reelStreaks {
      from {
        background-position-y: 0;
      }

      to {
        background-position-y: 40px;
      }
    }

    /* PLACEHOLDER FX — landing flash, fired once the roll settles on a cover. */
    .reel-flash {
      position: absolute;
      inset: 0;
      z-index: 15;
      opacity: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 45%, rgba(243, 240, 232, 0.95), rgba(243, 240, 232, 0) 62%);
    }

    .carousel.is-landed .reel-flash {
      animation: reelFlash 0.75s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    @keyframes reelFlash {
      0% {
        opacity: 0;
        transform: scale(0.85);
      }

      28% {
        opacity: 0.85;
        transform: scale(1.05);
      }

      100% {
        opacity: 0;
        transform: scale(1.35);
      }
    }

    /* PLACEHOLDER FX — small settle/bounce on the art itself when it lands. */
    .carousel.is-landed .cover-slide.is-active .cover__bg,
    .carousel.is-landed .cover-slide.is-active .cover__art {
      animation: reelLand 0.6s cubic-bezier(0.22, 1.4, 0.36, 1) both;
    }

    @keyframes reelLand {
      0% {
        transform: scale(1.06);
        filter: blur(2px);
      }

      100% {
        transform: scale(1);
        filter: blur(0);
      }
    }

    /* ============ Cover (magazine page) ============ */

    .cover {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      aspect-ratio: 1371 / 2300;
      background: #000;
      overflow: hidden;
    }

    .cover__bg,
    .cover__art {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cover__bg {
      z-index: 1;
    }

    .cover__art {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* Sits above the scrim AND the text (z-index 3–4) on purpose: this is
         the cutout layer, registered to the exact same crop as .cover__bg,
         so only its opaque pixels (hair, the CD case, the hand) fall in
         front of the masthead/nameplate — everything transparent still
         shows the text underneath. That's what gives the "breaking out of
         the frame" effect instead of just re-covering the whole slide. */
      z-index: 7;
      pointer-events: none;
    }

    .cover__scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.45) 0%, rgba(0, 0, 0, 0) 16%, rgba(0, 0, 0, 0) 62%, rgba(0, 0, 0, 0.65) 100%);
      pointer-events: none;
      z-index: 3;
    }

    .cover__top {
      position: absolute;
      top: 3.2%;
      left: 4.5%;
      right: 4.5%;
      display: flex;
      justify-content: space-between;
      color: var(--paper);
      font-family: var(--font-display);
      font-size: clamp(9px, 1.5vw, 18px);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
      z-index: 4;
    }

    .cover__nameplate {
      position: absolute;
      top: 9.5%;
      left: 4.5%;
      writing-mode: vertical-rl;
      text-orientation: upright;
      font-family: 'Wee', var(--font-display);
      font-size: clamp(50px, 6vw, 110px);
      font-weight: 700;
      color: var(--paper);
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6);
      z-index: 4;
      display: flex;
      gap: 12px;
    }

    .cover__nameplate rt {
      font-size: 0.4em;
      font-weight: normal;
      opacity: 0.85;
      letter-spacing: 0;
    }

    .cover__masthead {
      position: absolute;
      top: 3%;
      left: 0;
      right: 0;
      text-align: center;
      color: var(--paper);
      text-shadow: 0 2px 22px rgba(0, 0, 0, 0.55);
      z-index: 4;
    }

    .cover__masthead .eyebrow {
      display: block;
      font-size: clamp(8px, 1.4vw, 16px);
      letter-spacing: 0.5em;
      margin-bottom: 6px;
      margin-left: 0.5em;
    }

    .cover__masthead .wordmark {
      font-family: 'Lao';
      font-weight: 800;
      font-size: clamp(5.1rem, 12vw, 10rem);
      letter-spacing: 0.02em;
    }

    .cover__line {
      position: absolute;
      left: 5.5%;
      bottom: 15%;
      max-width: 78%;
      color: var(--paper);
      font-family: var(--font-display);
      font-weight: 700;
      font-style: italic;
      font-size: clamp(2rem, 8.5vw, 7.5rem);
      line-height: 1.04;
      text-shadow: 0 3px 24px rgba(0, 0, 0, 0.55);
      z-index: 4;
    }

    .cover__bottom-right {
      position: absolute;
      right: 4.5%;
      bottom: 3%;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 5px;
      z-index: 8;
    }

    .barcode {
      display: flex;
      align-items: flex-end;
      gap: 1.5px;
      height: 22px;
    }

    .barcode span {
      display: block;
      width: 2px;
      background: var(--paper);
      opacity: 0.9;
    }

    .cover__bottom-right .tag {
      color: var(--paper);
      font-size: clamp(9px, 1vw, 15px);
      letter-spacing: 0.18em;
      opacity: 0.85;
    }

    .caption {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 12px;
      text-align: center;
      color: rgba(243, 240, 232, 0.55);
      font-size: clamp(11px, 1vw, 15px);
      letter-spacing: 0.06em;
      z-index: 8;
    }

    /* ============ Cover — "Sekai" variant ============
       Applied via the .cover--sekai modifier so a second cover can read as
       a genuinely different design (deep indigo/gold palette, masthead
       pinned to the top edge, a vertical pull-quote balancing the
       nameplate) instead of the same template re-skinned with new art. */

    .cover--sekai .cover__scrim {
      background: linear-gradient(195deg, var(--deep-soft) 0%, rgba(18, 25, 54, 0.05) 32%, rgba(18, 25, 54, 0.05) 56%, rgba(18, 25, 54, 0.85) 100%);
    }

    .cover--sekai .cover__top {
      top: 1.8%;
      color: var(--frost);
    }

    .cover--sekai .cover__masthead {
      top: 5%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .cover--sekai .cover__masthead .wordmark {
      order: 1;
      color: var(--frost);
      font-size: clamp(6rem, 15vw, 12rem);
      letter-spacing: 0.03em;
    }

    .cover--sekai .cover__masthead .eyebrow {
      order: 2;
      margin: 10px 0 0;
      letter-spacing: 0.65em;
      color: var(--gold);
    }

    .cover--sekai .cover__nameplate {
      top: 26%;
      color: var(--frost);
      text-shadow: 0 1px 14px var(--deep-soft);
    }

    .cover__side-quote {
      position: absolute;
      top: 20%;
      right: 6%;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-family: var(--font-display);
      font-style: italic;
      font-size: clamp(13px, 1.9vw, 21px);
      letter-spacing: 0.34em;
      color: var(--frost);
      text-shadow: 0 1px 10px var(--deep-soft);
      z-index: 4;
    }

    .cover__side-quote rt {
      font-size: 0.44em;
      opacity: 0.8;
    }

    .cover--sekai .cover__line {
      left: auto;
      right: 5.5%;
      bottom: 11%;
      max-width: 40%;
      text-align: right;
      font-style: normal;
      font-weight: 400;
      font-size: clamp(1rem, 2.2vw, 1.4rem);
      letter-spacing: 0.14em;
      line-height: 1.7;
      padding: 16px 20px;
      border: 1px solid var(--gold);
      background: var(--deep-soft);
    }

    .cover--sekai .cover__bottom-right {
      left: 4.5%;
      right: auto;
      align-items: flex-start;
    }

    .cover--sekai .barcode span {
      background: var(--frost);
    }

    .cover__swatches {
      position: absolute;
      right: 4.5%;
      bottom: 3%;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 4;
    }

    .cover__swatches .chip {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      display: block;
    }

    .cover__swatches .swatch-label {
      color: var(--frost);
      font-size: clamp(8px, 0.9vw, 11px);
      letter-spacing: 0.22em;
      opacity: 0.8;
      margin-left: 6px;
    }

    @keyframes textFadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Text entrance stays paused until its slide is actually revealed,
       so it doesn't burn through its animation while hidden behind the
       intro (or behind another slide in the rotation). */
    .animate-text {
      opacity: 0;
      animation: textFadeUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      animation-play-state: paused;
    }

    .cover-slide.reveal-text .animate-text {
      animation-play-state: running;
    }

    .cover__top {
      animation-delay: 0.3s;
    }

    .cover__masthead {
      animation-delay: 0.5s;
    }

    .cover__nameplate {
      animation-delay: 0.6s;
    }

    .cover__line {
      animation-delay: 0.8s;
    }

    .cover__bottom-right {
      animation-delay: 1.0s;
    }

    .cover__side-quote {
      animation-delay: 0.9s;
    }

    .cover__swatches {
      animation-delay: 1.1s;
    }

    @media (prefers-reduced-motion: reduce) {

      .animate-text {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }

      .cover-slide {
        transition: none !important;
      }
    }
  </style>
</head>

              <ruby>ミ<rt>み</rt></ruby><ruby>ク<rt>く</rt></ruby>
            </div>
          </div>

          <div class="cover__masthead animate-text">
            <span class="eyebrow">Japan</span>
            <span class="wordmark">VOGUE</span>
          </div>

          <div class="cover__line animate-text">BACK<br>TO THE<br>2000s</div>

          <div class="cover__bottom-right animate-text">
            <div class="barcode"></div>
            <span class="tag">Miku</span>
          </div>

          <span class="caption">Hatsune Miku — illustration by Kieed</span>
        </div>
      </div>

      <div class="cover-slide" data-slide>
        <div class="cover cover--sekai">
          <img class="cover__bg" src="147630155_p0.jpg" alt="Background layer">

          <div class="cover__scrim"></div>

          <div class="cover__top animate-text">
            <span>21 June, 2026</span>
            <span>Vol. 05</span>
          </div>

          <div class="cover__nameplate animate-text">
            <div>
              <ruby>初<rt>は</rt></ruby><ruby>音<rt>つね</rt></ruby>
            </div>
            <div>
              <ruby>ミ<rt>み</rt></ruby><ruby>ク<rt>く</rt></ruby>
            </div>
          </div>

          <div class="cover__masthead animate-text">
            <span class="eyebrow">Sekai</span>
            <span class="wordmark">VOGUE</span>
          </div>

          <div class="cover__side-quote animate-text">
            <ruby>深<rt>ふか</rt></ruby>い<ruby>青<rt>あお</rt></ruby>の<ruby>中<rt>なか</rt></ruby>で
          </div>

          <div class="cover__line animate-text">WINTER<br>IN<br>BLUE</div>

          <div class="cover__bottom-right animate-text">
            <div class="barcode"></div>
            <span class="tag">Miku</span>
          </div>

          <div class="cover__swatches animate-text">
            <span class="chip" style="background: var(--deep);"></span>
            <span class="chip" style="background: var(--gold);"></span>
            <span class="chip" style="background: var(--coral);"></span>
            <span class="chip" style="background: var(--frost);"></span>
            <span class="swatch-label">Color story</span>
          </div>

          <span class="caption">Hatsune Miku — illustration by Kieed</span>
        </div>
      </div>

      <!--
        To add another cover to the rotation:
          1. Copy the whole "cover-slide" block above (from <div class="cover-slide" ...>
             down to its closing </div>).
          2. Paste it here as a sibling, WITHOUT the "is-active" class.
          3. Swap the image, nameplate, masthead, line and tag text for the new piece.
        The barcode, dot navigation, autoplay, roll-in reveal and text entrance
        animation all pick up new slides automatically — nothing else needs to change.
      -->

    </div>

    <!-- Roll FX (placeholders — swap the CSS/keyframes for these two whenever
         you have real effects ready):
           .reel-streaks → plays while the art is cycling
           .reel-flash   → plays once when it lands on the chosen cover -->
    <div class="reel-streaks" aria-hidden="true"></div>
    <div class="reel-flash" aria-hidden="true"></div>

    <button class="carousel__arrow carousel__arrow--prev" type="button" aria-label="Previous cover">‹</button>
    <button class="carousel__arrow carousel__arrow--next" type="button" aria-label="Next cover">›</button>
    <div class="carousel__dots" id="carouselDots"></div>
  </div>

  <script>
    // ---------- Signature intro ----------
    (function () {
      const intro = document.getElementById('intro');
      const skip = document.getElementById('introSkip');
      const sig = document.querySelector('.intro__sig');
      let revealed = false;

      // Each stroke's duration is based on its REAL length (getTotalLength()),
      // not a hand-guessed number — so this works no matter how many paths
      // the signature has or how long each one is. Delays are chained with a
      // slight overlap so strokes flow into each other like real handwriting
      // instead of pausing dead between every single one.
      const DRAW_SPEED = 5.2;   // px of path length drawn per ms — raise to draw faster
      const OVERLAP = 0.6;      // next stroke starts at 60% through the previous one
      const MIN_DURATION = 90;  // ms — keeps tiny dots/strokes from being instant

      const paths = Array.from(sig.querySelectorAll('path'));

      // Order strokes left-to-right by each path's leftmost point, instead of
      // whatever order they were drawn/exported in — so the whole signature
      // writes on left-to-right like reading order.
      paths.sort((a, b) => a.getBBox().x - b.getBBox().x);

      let cursor = 0;
      paths.forEach((p) => {
        const len = p.getTotalLength();
        const duration = Math.max(MIN_DURATION, len / DRAW_SPEED);
        p.style.setProperty('--len', len);
        p.style.animationDuration = duration + 'ms';
        p.style.animationDelay = cursor + 'ms';
        cursor += duration * OVERLAP;
      });
      const lastDuration = parseFloat(paths[paths.length - 1].style.animationDuration);
      const totalDrawTime = cursor + lastDuration;

      // Only start drawing once the real lengths/timings above are set.
      sig.classList.add('is-ready');

      function reveal() {
        if (revealed) return;
        revealed = true;
        intro.classList.add('is-hidden');
        document.dispatchEvent(new CustomEvent('intro:done'));
        setTimeout(() => { intro.style.display = 'none'; }, 650);
      }

      // Not gating this behind prefers-reduced-motion any more — a system-level
      // "reduce motion" setting (common on Windows, and it applies identically
      // across Brave/Chrome/Edge since they all read the same OS flag) was the
      // likely reason the draw never appeared to play. Skip below remains the
      // manual, always-available way to bypass it.
      skip.classList.add('is-visible');

      // Once the signature has actually finished drawing, swap the quiet
      // "Skip" label for an explicit "Please click to continue" prompt and
      // stop auto-advancing — clicking through here is also the user gesture
      // browsers require before they'll let any sound effects play once the
      // roll starts, so this doubles as making sure audio actually works.
      setTimeout(() => {
        skip.textContent = 'Please click to continue';
        skip.classList.add('is-prompt');
      }, totalDrawTime + 300);

      intro.addEventListener('click', reveal);
    })();

    // ---------- Carousel ("roulette") ----------
    (function () {
      const carousel = document.getElementById('carousel');
      const track = document.getElementById('carouselTrack');
      const slides = Array.from(track.querySelectorAll('.cover-slide'));
      const dotsWrap = document.getElementById('carouselDots');
      const prevBtn = document.querySelector('.carousel__arrow--prev');
      const nextBtn = document.querySelector('.carousel__arrow--next');
      const AUTOPLAY_MS = 7000;
      let current = slides.findIndex((s) => s.classList.contains('is-active'));
      if (current < 0) current = 0;
      let timer = null;
      let landed = false; // becomes true once the roll settles on a cover

      // ---- Sound FX ----
      // sfx.click    → Library of Ruina click/dice-roll — fires once, when the
      //                roll lands on the chosen cover.
      // sfx.pageFlip → magazine page turn — fires on every roll tick (so the
      //                spin sounds like pages flipping past) and on manual
      //                next/prev/dot navigation.
      // No dedicated "rolling" sound was supplied, so the page-flip doubles as
      // that — swap in a real spin/whirr file later by pointing sfx.roll at it
      // and calling playSfx('roll', ...) instead inside tick() below.
      const sfx = {
        click: new Audio('sfx-click.mp3'),
        pageFlip: new Audio('sfx-page-flip.mp3'),
      };
      Object.values(sfx).forEach((a) => { a.preload = 'auto'; });

      function playSfx(key, { volume = 1, rate = 1 } = {}) {
        const base = sfx[key];
        if (!base) return;
        const node = base.cloneNode(); // clone so overlapping/rapid plays don't cut each other off
        node.volume = volume;
        node.playbackRate = rate;
        node.play().catch(() => { }); // ignore autoplay-blocked errors
      }

      // Browsers won't play audio until the page has had a user gesture. The
      // intro is clickable/skippable, but if someone just lets it play out
      // untouched, prime playback on the first pointer/key event so the very
      // first SFX (usually a roll tick) isn't silently dropped.
      let audioUnlocked = false;
      function unlockAudio() {
        if (audioUnlocked) return;
        audioUnlocked = true;
        Object.values(sfx).forEach((a) => {
          a.play().then(() => { a.pause(); a.currentTime = 0; }).catch(() => { });
        });
      }
      ['pointerdown', 'keydown'].forEach((evt) =>
        document.addEventListener(evt, unlockAudio, { once: true, passive: true })
      );

      slides.forEach((slide, i) => {
        const dot = document.createElement('button');
        dot.type = 'button';
        dot.className = 'carousel__dot';
        dot.setAttribute('aria-label', 'Go to cover ' + (i + 1));
        dot.addEventListener('click', () => goTo(i, true));
        dotsWrap.appendChild(dot);
      });
      const dots = Array.from(dotsWrap.children);

      function render() {
        slides.forEach((s, i) => s.classList.toggle('is-active', i === current));
        dots.forEach((d, i) => d.classList.toggle('is-active', i === current));
        if (landed) slides[current].classList.add('reveal-text');
      }

      function goTo(i, manual) {
        current = (i + slides.length) % slides.length;
        playSfx('pageFlip', { volume: manual ? 0.6 : 0.4 });
        render();
        if (manual) restartAutoplay();
      }

      // ---- Roll ("slot machine") reveal ----
      // Cycles the cover art through the slides, slowing down tick by tick,
      // then lands on a randomly chosen slide. Runs once, right after the
      // signature intro finishes. If there's only one slide, it just lands
      // on it directly — nothing to roll through.
      function startRoll() {
        if (slides.length < 2) {
          landOn(current);
          return;
        }

        carousel.classList.add('is-rolling');

        const finalIndex = Math.floor(Math.random() * slides.length);
        const TICKS = 16 + Math.floor(Math.random() * 5); // 16–20 stops
        let tickCount = 0;
        let idx = current;

        function tick() {
          idx = (idx + 1) % slides.length;
          // Force the last stop to be the chosen slide so the reel actually
          // lands on it rather than wherever modulo math happens to put it.
          if (tickCount === TICKS - 1) idx = finalIndex;
          slides.forEach((s, i) => s.classList.toggle('is-active', i === idx));

          // Pitch climbs slightly as the reel speeds toward its fastest point,
          // then eases back down with the deceleration — mirrors the visual.
          const progress = tickCount / TICKS;
          playSfx('pageFlip', { volume: 0.45, rate: 0.9 + Math.sin(progress * Math.PI) * 0.5 });

          tickCount++;
          if (tickCount < TICKS) {
            const delay = 55 + Math.pow(progress, 3) * 480; // ease into a slowdown
            setTimeout(tick, delay);
          } else {
            landOn(idx);
          }
        }

        tick();
      }

      function landOn(idx) {
        current = idx;
        landed = true;
        carousel.classList.remove('is-rolling');
        render();
        carousel.classList.add('is-landed');
        playSfx('click', { volume: 0.9 });
        setTimeout(() => carousel.classList.remove('is-landed'), 800);
        startAutoplay();
      }

      function next(manual) { goTo(current + 1, manual); }
      function prev(manual) { goTo(current - 1, manual); }

      function startAutoplay() {
        if (slides.length < 2) return;
        timer = setInterval(() => next(false), AUTOPLAY_MS);
      }

      function restartAutoplay() {
        clearInterval(timer);
        startAutoplay();
      }

      prevBtn.addEventListener('click', () => prev(true));
      nextBtn.addEventListener('click', () => next(true));

      // Barcode, scoped per-slide so extra covers just work
      slides.forEach((slide) => {
        const barcode = slide.querySelector('.barcode');
        if (barcode) {
          let bars = '';
          for (let i = 0; i < 22; i++) {
            const w = [1, 2, 1, 3, 1, 1][i % 6];
            const h = 8 + ((i * 5) % 14);
            bars += `<span style="width:${w}px;height:${h}px;"></span>`;
          }
          barcode.innerHTML = bars;
        }
      });

      render();
      document.addEventListener('intro:done', startRoll, { once: true });
    })();
  </script>
